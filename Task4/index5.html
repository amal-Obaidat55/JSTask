<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="style">
        <h1>Sign Up</h1>
        <form id="form">
            <label for="user">Enter Username : </label><br>
            <input name="userName" type="text" id="user">
            <div id="name"></div>
            <br><br>
            <label for="password">Enter Password : </label><br>
            <input name="pass" type="password" id="password">
            <div id="pass"></div>
            <br><br>
            <label for="number">Enter Phone Number : </label><br>
            <input name="number" type="tel" id="number">
            <div id="phone"></div>
            <br><br>
            <select id="order">
                <option value="Zinger">Zinger</option>
                <option value="Burger">Burger</option>
                <option value="Pizza">Pizza</option>
                <option value="Shawarma">Shawarma</option>
            </select>
            <br><br><br>

        </form>
        <button id="btn">Submit</button>
        <div id="orderDetails"></div>
    </div>

    <script src="script5.js"></script>
</body>

</html>
